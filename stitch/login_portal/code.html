<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BRIN Login Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=Lora:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#bb1b1b",
                        "background-light": "#F8FAFC",
                        "background-dark": "#211111",
                        "surface": "#FFFFFF",
                        "text-main": "#0F172A",
                        "muted": "#64748B",
                        "accent": "#0369A1"
                    },
                    fontFamily: {
                        "display": ["IBM Plex Sans", "sans-serif"],
                        "heading": ["Lora", "serif"],
                        "body": ["IBM Plex Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0px",
                        "sm": "0px",
                        "md": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "0px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Lora', serif;
        }
        /* Ensure sharp corners globally to override any default browser styles */
        * {
            border-radius: 0px !important;
        }
        
        .multiply-overlay {
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="bg-background-light text-text-main h-screen w-screen overflow-hidden flex flex-col md:flex-row">
<!-- Left Panel: Form Container (40%) -->
<main class="w-full md:w-[40%] h-full bg-surface flex flex-col justify-center items-center p-8 relative z-10">
<div class="w-full max-w-[400px] flex flex-col gap-8">
<!-- Branding / Header -->
<div class="flex flex-col gap-2">
<div class="flex items-center gap-3 text-primary mb-4">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">science</span>
<span class="font-heading font-bold text-2xl text-text-main uppercase tracking-wider">BRIN</span>
</div>
<h1 class="font-heading text-[32px] font-bold text-text-main leading-tight">Institutional Access</h1>
<p class="text-muted text-sm mt-1">Secure authentication gateway for authorized researchers.</p>
<div class="w-10 h-1 bg-primary mt-4"></div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5 mt-4" id="loginForm">
<!-- Shared Component Logic Applied: Extracted structure, mapped to theme -->
<div class="flex flex-col gap-4">
<label class="flex flex-col flex-1">
<p class="text-text-main text-[13px] font-semibold leading-normal pb-2 uppercase tracking-wide">Email Address</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-text-main border border-muted bg-surface focus:border-text-main focus:ring-0 focus:outline-none h-12 placeholder:text-muted p-4 text-base font-normal leading-normal transition-colors" id="email" placeholder="Enter your institutional email" required="" type="email"/>
</label>
</div>
<div class="flex flex-col gap-4">
<label class="flex flex-col flex-1">
<p class="text-text-main text-[13px] font-semibold leading-normal pb-2 uppercase tracking-wide">Password</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-text-main border border-muted bg-surface focus:border-text-main focus:ring-0 focus:outline-none h-12 placeholder:text-muted p-4 text-base font-normal leading-normal transition-colors" id="password" placeholder="Enter your password" required="" type="password"/>
</label>
<div class="hidden text-primary text-[13px] mt-1" id="error-message">Invalid institutional credentials</div>
</div>
<!-- Submit Action -->
<button class="mt-4 w-full h-12 bg-primary hover:bg-[#991B1B] text-surface font-semibold text-[14px] uppercase tracking-wider transition-colors flex items-center justify-center gap-2 group disabled:bg-slate-300 disabled:cursor-not-allowed" id="submitBtn" type="submit">
<span id="btnText">Authenticate</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1" id="btnIcon">arrow_forward</span>
<span class="hidden material-symbols-outlined animate-spin text-[20px]" id="btnSpinner">progress_activity</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center text-sm text-muted">
<a class="hover:text-primary transition-colors underline decoration-1 underline-offset-2" href="#">Request Access</a>
<span class="mx-2">|</span>
<a class="hover:text-primary transition-colors underline decoration-1 underline-offset-2" href="#">IT Support</a>
</div>
</div>
</main>
<!-- Right Panel: Hero Image (60%) -->
<aside class="hidden md:block md:w-[60%] h-full relative overflow-hidden bg-text-main">
<!-- Base Image -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A highly detailed, professional photograph of a modern server room or advanced research laboratory at an institution. The scene is illuminated by crisp, white ambient lighting reflecting off metallic server racks and glass panels. The overall aesthetic is highly structured, technical, and academic, fitting a state-of-the-art deep learning research facility." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBKZiF86NZ55yjVU8I3HRwGr4pV0NdCmJXHZ5XitRgO8LSW4UonsjRTsAa32aj8p6_aoF1HEc63uH8vK8IuPdWQmsdfPIz9TtB8aJh_iJn11mmCwVZljk9QS6p8JHCGhqlrgN1darQrzfCW9PVs5Og0lQzEM9cuC-5mPYNaN2KsEFrVkXBpedh5gOE9WRiR9npovuoOizkfCHTi9E1Ilcvei4COzFMBb-bIEn6d4xExAKKtaKPjrF8')"></div>
<!-- Red Multiply Blend Overlay -->
<div class="absolute inset-0 bg-primary opacity-80 multiply-overlay"></div>
<!-- Subtle Pattern / Gradient overlay for depth -->
<div class="absolute inset-0 bg-gradient-to-br from-transparent to-text-main opacity-60"></div>
<!-- Optional Decorative Element -->
<div class="absolute bottom-12 right-12 text-right">
<h2 class="font-heading text-4xl text-surface opacity-90 font-bold mb-2">Deep Learning Hub</h2>
<p class="font-body text-surface opacity-75 max-w-md ml-auto">Empowering rigorous academic research through scalable neural network infrastructure.</p>
</div>
</aside>
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnSpinner = document.getElementById('btnSpinner');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('error-message');

            // Reset error state
            emailInput.classList.remove('border-primary');
            passwordInput.classList.remove('border-primary');
            errorMsg.classList.add('hidden');

            // Loading state
            btn.disabled = true;
            btnText.textContent = 'Authenticating...';
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            // Simulate network request
            setTimeout(() => {
                // Simulate error for demonstration
                btn.disabled = false;
                btnText.textContent = 'Authenticate';
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
                
                emailInput.classList.add('border-primary', 'border-2');
                passwordInput.classList.add('border-primary', 'border-2');
                errorMsg.classList.remove('hidden');
                
                // Remove 2px border if they type again
                emailInput.addEventListener('input', function() {
                    emailInput.classList.remove('border-primary', 'border-2');
                    errorMsg.classList.add('hidden');
                }, { once: true });
                
                passwordInput.addEventListener('input', function() {
                    passwordInput.classList.remove('border-primary', 'border-2');
                    errorMsg.classList.add('hidden');
                }, { once: true });

            }, 1500);
        });
    </script>
</body></html>
