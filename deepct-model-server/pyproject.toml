[project]
name = "deepct-model-server"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "numpy==1.26.4",
  "pillow==12.3.0",
  "tifffile==2025.5.10",
  "h5py==3.14.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
inference = ["tensorflow==2.17.0", "keras==3.15.1"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "httpx2==2.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
