name: Registry and upload CPU tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 CPU
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepct-model-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deepct-model-server/requirements-cpu.lock
      - name: Install frozen CPU dependencies
        run: python -m pip install --require-hashes -r requirements-cpu.lock
      - name: Verify CPU-only environment
        run: |
          python -m pip check
          python - <<'PY'
          from importlib.metadata import distributions
          packages = {d.metadata['Name'].lower().replace('_', '-') for d in distributions()}
          assert not any(p.startswith(('tensorflow', 'nvidia-')) for p in packages), packages
          PY
      - name: Registry, upload, API and compatibility suite
        run: python -m pytest -q
