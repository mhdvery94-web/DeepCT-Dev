name: Deploy staging backend

on:
  workflow_run:
    workflows: [Release]
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      activate_gemini:
        description: 'Run the real-provider canary and activate Gemini only if it passes'
        required: false
        type: boolean
        default: false
      model_operation:
        description: 'Audit or activate one retained model in isolated staging'
        required: false
        type: choice
        options: [none, audit, activate]
        default: none
      model_id:
        description: 'Immutable managed model identifier'
        required: false
        default: 'ginet-tcd-revisi'
      model_version:
        description: 'Immutable semantic version'
        required: false
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: raspi-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Raspberry Pi staging
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
    runs-on: [self-hosted, Linux, ARM64, deepct-raspi]
    env:
      DEPLOY_PATH: /home/jihyo/deepct-staging/app
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Synchronize staging source
        run: |
          set -euo pipefail
          test -f "$DEPLOY_PATH/.env"
          rsync -az --delete --human-readable --stats \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='rr' \
            --exclude='rr.exe' \
            --exclude='.rr.yaml' \
            --exclude='public/build' \
            --exclude='public/storage' \
            --exclude='auth.json' \
            --exclude='.git/' \
            be/ "$DEPLOY_PATH"/

      - name: Install, back up and migrate staging
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          mkdir -p \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs \
            storage/backups

          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          npm ci --omit=dev --no-audit --no-fund

          env_value() { sed -n "s/^$1=//p" .env | tail -1 | tr -d "\"'"; }
          DB_DATABASE="$(env_value DB_DATABASE)"
          DB_USERNAME="$(env_value DB_USERNAME)"
          DB_PASSWORD="$(env_value DB_PASSWORD)"
          DB_HOST="$(env_value DB_HOST)"
          test "$DB_DATABASE" = "deepct_staging"

          STAMP="$(date +%Y%m%d-%H%M%S)"
          MYSQL_PWD="$DB_PASSWORD" mysqldump \
            --single-transaction --quick --routines \
            -h "${DB_HOST:-127.0.0.1}" -u "${DB_USERNAME:-root}" \
            "$DB_DATABASE" | gzip > "storage/backups/db-$STAMP.sql.gz"
          # shellcheck disable=SC2012
          ls -1t storage/backups/db-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm --

          php artisan migrate --force
          php artisan app:cleanup-retired-data
          APP_COMMIT_SHA="$DEPLOY_SHA" \
            APP_BUILD_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          chmod -R ug+rwX bootstrap/cache storage || true

      - name: Restart and verify isolated services
        run: |
          set -euo pipefail
          sudo -n systemctl restart \
            deepct-staging-api \
            deepct-staging-queue \
            deepct-staging-scheduler
          # The LLM worker is optional until its first approved canary. Once
          # installed, it must reload the same freshly cached config as the API.
          if sudo -n systemctl is-active --quiet deepct-staging-llm; then
            sudo -n systemctl restart deepct-staging-llm
          fi

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://100.85.94.74:8001/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          VERSION="$(curl -fsS http://127.0.0.1:8003/staging/api/version)"
          ACTUAL_SHA="$(php -r "\$d=json_decode(stream_get_contents(STDIN), true); echo \$d['data']['commit_sha'] ?? '';" <<< "$VERSION")"
          test "$ACTUAL_SHA" = "$DEPLOY_SHA"
          curl -fsS http://127.0.0.1:8003/api/health >/dev/null

          {
            echo '### Staging backend deployed'
            echo "Commit: $DEPLOY_SHA"
            echo 'Production API and production database were not targeted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded real-provider Gemini canary
        if: github.event_name == 'workflow_dispatch' && inputs.activate_gemini
        env:
          STAGING_GEMINI_API_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_GEMINI_API_KEY"
          cd "$DEPLOY_PATH"
          php artisan app:canary-gemini-assistant

      - name: Audit or activate retained staging model
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.model_operation != 'none'
        env:
          MODEL_OPERATION: ${{ inputs.model_operation }}
          MODEL_ID: ${{ inputs.model_id }}
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          args=(models:activate-staging "$MODEL_ID" "$MODEL_VERSION" --no-interaction)
          if [ "$MODEL_OPERATION" = activate ]; then
            args+=(--apply)
          fi
          php artisan "${args[@]}"

          {
            echo '### Staging model operator completed'
            echo "Action: $MODEL_OPERATION"
            echo "Model: $MODEL_ID $MODEL_VERSION"
            echo 'No production service or database was targeted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Back up configuration and record current LLM worker state
        if: github.event_name == 'workflow_dispatch' && inputs.activate_gemini
        run: |
          set -euo pipefail
          BACKUP_PATH="$DEPLOY_PATH/.env.before-gemini-$GITHUB_RUN_ID"
          install -m 0600 "$DEPLOY_PATH/.env" "$BACKUP_PATH"
          echo "BACKUP_PATH=$BACKUP_PATH" >> "$GITHUB_ENV"
          if sudo -n systemctl is-active --quiet deepct-staging-llm; then
            echo 'LLM_WAS_ACTIVE=true' >> "$GITHUB_ENV"
          else
            echo 'LLM_WAS_ACTIVE=false' >> "$GITHUB_ENV"
          fi

      - name: Activate Gemini only after canary passes
        if: github.event_name == 'workflow_dispatch' && inputs.activate_gemini
        env:
          STAGING_GEMINI_API_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          php "$GITHUB_WORKSPACE/be/scripts/configure-staging-gemini.php" "$DEPLOY_PATH/.env"
          cd "$DEPLOY_PATH"
          APP_COMMIT_SHA="$DEPLOY_SHA" php artisan config:cache

          sudo -n install -m 0644 \
            "$GITHUB_WORKSPACE/be/deploy/staging/deepct-staging-llm.service" \
            /etc/systemd/system/deepct-staging-llm.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable deepct-staging-llm
          # queue:work is long-lived and keeps the configuration loaded at
          # process start. Always restart it after replacing .env/config cache.
          sudo -n systemctl restart deepct-staging-llm
          sudo -n systemctl restart deepct-staging-api

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://100.85.94.74:8001/api/health >/dev/null \
              && sudo -n systemctl is-active --quiet deepct-staging-llm; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl -fsS http://127.0.0.1:8003/staging/api/health >/dev/null

      - name: Roll back Gemini staging activation after failure
        if: >-
          failure()
          && github.event_name == 'workflow_dispatch'
          && inputs.activate_gemini
          && env.BACKUP_PATH != ''
        run: |
          set -euo pipefail
          install -m 0600 "$BACKUP_PATH" "$DEPLOY_PATH/.env"
          cd "$DEPLOY_PATH"
          php artisan config:cache
          sudo -n systemctl restart deepct-staging-api
          if [ "${LLM_WAS_ACTIVE:-false}" = true ]; then
            sudo -n systemctl restart deepct-staging-llm
          else
            sudo -n systemctl disable --now deepct-staging-llm || true
          fi
          rm -- "$BACKUP_PATH"

      - name: Remove temporary Gemini configuration backup
        if: >-
          success()
          && github.event_name == 'workflow_dispatch'
          && inputs.activate_gemini
          && env.BACKUP_PATH != ''
        run: rm -- "$BACKUP_PATH"

      - name: Record Gemini activation without secret material
        if: success() && github.event_name == 'workflow_dispatch' && inputs.activate_gemini
        run: |
          {
            echo '### Staging Gemini canary passed'
            echo '- Model: gemini-2.5-flash-lite'
            echo '- Bounded intent cases: 8/8'
            echo '- Isolated staging LLM worker: active'
            echo '- Production configuration: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
