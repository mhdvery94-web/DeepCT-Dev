name: Release

# Builds the clients, deploys the web one, and publishes the lot.
#
#   any branch   tests, web, and a Vercel preview URL
#   main         adds Android and iOS, deploys web to production, and refreshes
#                the rolling `latest` pre-release with all three files
#   tag v*       the same, published as a real versioned release, plus Drive
#   manual run   the same as a tag, minus the release itself
#
# WHY IT IS ONE WORKFLOW
#
# Deploying used to live in its own file, which meant every push to main ran
# `flutter build web` twice — once to make the release zip, once to make the
# thing that got deployed. The `web` job builds it once now and both consumers
# take the artifact.
#
# WHAT MAKES IT FASTER
#
# - `web`, `android` and `ios` no longer wait for `test`. They run beside it,
#   and `publish` is what waits for all four. A red test suite still cannot
#   publish anything; it just no longer adds its own minutes to the wall clock
#   before the first build starts.
# - Gradle and pub caches. An uncached Android job spends several minutes
#   re-downloading dependencies that never changed.
#
# There is no `paths:` filter. It would skip builds for backend-only pushes,
# but GitHub does not apply path filters to tag pushes consistently, and a
# release that silently does not run is a far worse failure than a few spent
# minutes.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL to compile into the clients'
        required: false
        default: ''

# Pushing twice in a minute should not leave two builds racing for the same
# artifact names. The newer push wins; a tag build is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; `publish` asks for write and is the only job that
# needs it. Stated here so the answer to "what can this workflow touch?" is one
# line rather than a search.
permissions:
  contents: read

env:
  # Keep in step with fe/vercel-build.sh. This is the SDK the tree is actually
  # developed and verified against.
  FLUTTER_VERSION: '3.44.9'
  # Where the built clients look for the backend. It is compiled in, so it has
  # to be decided here rather than at run time. NGROK_BE is the repository
  # variable in use; API_BASE_URL is honoured for anyone still setting it.
  API_BASE_URL: >-
    ${{ github.event.inputs.api_base_url
        || vars.NGROK_BE
        || vars.API_BASE_URL
        || 'https://nucleus-drone-grueling.ngrok-free.dev/api' }}

jobs:
  # Ten seconds that stop a ten-minute build from producing clients nobody can
  # use. The address is compiled in, so a wrong one is not discovered until
  # somebody installs the APK and every request 404s — which is exactly how
  # 1.19.1 happened, and how the first `latest` pre-release shipped three
  # clients built against a URL with no `/api` on the end.
  preflight:
    name: Check the API address
    runs-on: ubuntu-latest
    steps:
      - name: Validate API_BASE_URL
        run: |
          set -euo pipefail

          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::API_BASE_URL is empty. Set the repository variable NGROK_BE."
            exit 1
          fi

          # ApiConfig.baseUrl is documented as "including the /api prefix" and
          # the client appends paths straight onto it: without the suffix every
          # call goes to /login instead of /api/login.
          case "$API_BASE_URL" in
            */api|*/api/) ;;
            *)
              echo "::error::API_BASE_URL is '$API_BASE_URL', which does not end in /api."
              echo "The client appends paths directly to it, so every request would 404."
              echo "Set the repository variable NGROK_BE to '${API_BASE_URL%/}/api'."
              exit 1
              ;;
          esac

          echo "API_BASE_URL = $API_BASE_URL"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('fe/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Analyze and test
        working-directory: fe
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # The backend suite, which did not run here before.
  #
  # That mattered less while this file only built clients: a broken backend
  # could not reach anybody through it. The `vps` job below changes that, and a
  # deploy gated only on `test` would be claiming "tested" about the half it
  # never touched.
  test-backend:
    name: Tests (backend)
    runs-on: ubuntu-latest
    # MySQL rather than sqlite, for the reason phpunit.xml gives at length: two
    # migrations run `ALTER TABLE ... MODIFY`, and `activity_type` starts life
    # as an enum the application long outgrew. A sqlite run produces both false
    # passes and false failures, which is worse than no run at all.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_aict_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # phpunit.xml already forces DB_CONNECTION and DB_DATABASE. These are the
      # four it cannot know. Laravel's dotenv is immutable, so a real
      # environment variable wins over `.env`, and the sqlite default sitting
      # in `.env.example` never takes effect here.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      # 8.3 because that is what the VPS runs. composer.json allows 8.2, so
      # testing on 8.3 tests the version production will actually execute.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip, fileinfo, bcmath
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('be/composer.lock') }}
          restore-keys: composer-

      - name: Install
        working-directory: be
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate

      - name: Test
        working-directory: be
        run: php artisan test

  web:
    name: Web
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('fe/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Build
        working-directory: fe
        run: |
          echo "Building against $API_BASE_URL"
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL

      # Twice, deliberately: the zip is what a release ships, the directory is
      # what the deploy job hands to Vercel. Unzipping to deploy would work too,
      # and would cost a step on every deployment to save one here.
      - name: Package
        working-directory: fe/build/web
        run: zip -r "$GITHUB_WORKSPACE/brin-neutron-ct-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: brin-neutron-ct-web.zip

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: fe/build/web

  vercel:
    name: Deploy to Vercel
    needs: web
    runs-on: ubuntu-latest
    # Vercel's own Git integration is not used: on the Hobby plan with a private
    # repository it refuses any commit whose author is not the account owner,
    # which blocked every deployment this project ever made. A deployment made
    # with a token is attributed to the token's owner, so that check never runs.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Must match the project's **Root Directory** in Vercel → Settings →
      # Build and Deployment, because the CLI resolves that setting against the
      # working directory and refuses to deploy when the result does not exist:
      #
      #   Error: The provided path ".../deepCT-AI/fe" does not exist.
      #
      # That is what the setting `fe` produced here: this job never checks the
      # repository out — it only downloads the built web files — so there was no
      # `fe/` to find. The Root Directory is `./` now, which is the right answer
      # for a prebuilt deployment: nothing is built here, so there is no
      # subdirectory for Vercel to build *in*.
      #
      # If it is ever pointed back at a subdirectory, change this to match and
      # the output moves with it.
      VERCEL_ROOT_DIR: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ${{ env.VERCEL_ROOT_DIR }}/.vercel/output/static

      # A prebuilt deployment takes its routing from this file and ignores
      # vercel.json. The rewrite is what stops a deep link answering 404 on
      # reload; the cache headers are what stop a visitor being pinned to an
      # old build for ever.
      - name: Describe the output
        run: |
          set -euo pipefail
          cat > "$VERCEL_ROOT_DIR/.vercel/output/config.json" <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/assets/(.*)$",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              {
                "src": "^/(index\\.html|flutter_service_worker\\.js|version\\.json)$",
                "headers": { "cache-control": "public, max-age=0, must-revalidate" },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "/.*", "dest": "/index.html" }
            ]
          }
          JSON

      - name: Deploy
        # `pipefail` is the whole reason this reads the way it does. Piping the
        # CLI into `tee` hands the step `tee`'s exit status, so the first
        # deployment reported **success** while its log said
        # "Error: The provided path ... does not exist" and nothing shipped.
        # A deploy that fails quietly is worse than one that fails.
        run: |
          set -euo pipefail

          PROD=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROD="--prod"
          fi

          npx --yes vercel@latest deploy --prebuilt $PROD \
            --token="${{ secrets.VERCEL_TOKEN }}" | tee url.txt

          URL="$(tail -1 url.txt)"

          case "$URL" in
            https://*) ;;
            *)
              echo "::error::The CLI exited 0 but printed no deployment URL."
              exit 1
              ;;
          esac

          {
            echo "### Deployed"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

  vps:
    name: Deploy backend to VPS
    # `test-backend`, not `test`: this job ships `be/` and nothing else.
    needs: [test-backend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One deployment at a time, and never cancelled halfway. A run interrupted
    # between `rsync` and the restart leaves new code under an old process —
    # the exact state CLAUDE.md warns about, where a new route 404s and nothing
    # in the logs says why.
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH: ${{ secrets.VPS_SSH }}
      # Optional. When set, the host key is pinned from it rather than being
      # learned on the spot — see the comment on the connection step.
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_PATH: /var/www/deepct-ai
    steps:
      - uses: actions/checkout@v4

      # Named individually rather than counted, because "a secret is missing"
      # sends someone to read four settings pages.
      - name: Check the secrets are all here
        run: |
          set -euo pipefail

          missing=""
          [ -n "${VPS_HOST:-}" ]     || missing="$missing VPS_HOST"
          [ -n "${VPS_USERNAME:-}" ] || missing="$missing VPS_USERNAME"
          [ -n "${VPS_SSH:-}" ]      || missing="$missing VPS_SSH"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Deploying to ${VPS_USERNAME}@${VPS_HOST}:${VPS_PORT:-22} $DEPLOY_PATH"

      - name: Open the SSH connection
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Host key handling, stated plainly because the two branches are not
          # equally safe. With VPS_KNOWN_HOSTS set the key is pinned and a
          # substituted host is refused. Without it the key is learned from
          # whatever answers on that address — which still catches a host that
          # changes between runs, but trusts the first one. Weaker than
          # pinning, and better than StrictHostKeyChecking=no, which trusts
          # every one of them.
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "Host key pinned from VPS_KNOWN_HOSTS."
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::VPS_KNOWN_HOSTS is not set, so the host key was accepted on sight."
            echo "Pin it with: ssh-keyscan -p ${VPS_PORT:-22} -H <host>"
          fi
          chmod 600 ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<CONF
          Host deploy
            HostName $VPS_HOST
            User $VPS_USERNAME
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONF

          ssh deploy 'echo "Connected as $(whoami) on $(hostname), $(uname -sr)"'

      # `--delete`, so a file removed from the repository is removed from the
      # server too: a controller deleted here but left there is a route that
      # still answers.
      #
      # Everything excluded is also protected from that `--delete` — rsync's
      # default for excluded paths, and the reason this is safe to run.
      #
      # The list is not arbitrary. Everything on it is in `be/.gitignore`,
      # which means it is absent from the source of this copy, which means
      # `--delete` would remove it from the server. For the data that would be
      # a catastrophe and for the binaries it would be a puzzle:
      #
      #   .env         the server's own configuration, never ours to overwrite
      #   storage/     uploads, results and training datasets. The data.
      #   vendor/      installed on the server, against the server's own PHP
      #   rr, .rr.yaml RoadRunner itself. `octane:install` downloads the binary
      #                once during provisioning and it is gitignored, so
      #                without this line every deploy would delete the server
      #                it just restarted — and `octane:start` would fail with a
      #                missing-binary error that reads like a broken install.
      #   public/build Vite output, built on the server if it is needed at all
      #   auth.json    composer credentials, if the server ever has any
      #   rr.exe       RoadRunner for Windows. Gitignored too, so it is never in
      #                the source; listed because a 30 MB PE file arriving on a
      #                Linux box would be a long afternoon.
      - name: Send the backend
        run: |
          set -euo pipefail

          rsync -az --delete --human-readable --stats \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='rr' \
            --exclude='rr.exe' \
            --exclude='.rr.yaml' \
            --exclude='public/build' \
            --exclude='public/storage' \
            --exclude='auth.json' \
            --exclude='.git/' \
            be/ deploy:"$DEPLOY_PATH"/

      - name: Install, back up, migrate, restart
        run: |
          set -euo pipefail

          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "::error::$DEPLOY_PATH/.env does not exist."
            echo "The server keeps its own configuration; the deploy never writes one."
            echo "ARCHITECTURE.md section 8 lists what it has to contain."
            exit 1
          fi

          # The storage skeleton, recreated on every deploy because it can
          # never arrive by any other route.
          #
          # `storage/` is excluded from the rsync above — it holds the uploads,
          # the results and the training datasets, and a deploy has no business
          # touching those. But the same exclusion means the *empty* directories
          # Laravel needs at run time never arrive either. They exist in the
          # repository as folders holding nothing but a .gitignore, and rsync
          # skips the lot.
          #
          # Missing, they produce "Please provide a valid cache path" on every
          # request: a 500 that names a directory under storage/framework and
          # is routinely misread as a missing view, because the word that
          # catches the eye is `views`. resources/views is tracked and arrives
          # with everything else; storage/framework/views is the one that does
          # not.
          echo "--- Storage skeleton"
          mkdir -p \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs \
            storage/backups
          echo "ensured."

          echo "--- Dependencies"
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

          # The backup goes before the migration, not after. ARCHITECTURE.md
          # section 8 lists "no database backups" as an outstanding item, and
          # running migrations automatically against a live database is the
          # moment that stops being tolerable.
          echo "--- Backup"
          env_value() { sed -n "s/^$1=//p" .env | tail -1 | tr -d "\"'"; }
          DB_DATABASE="$(env_value DB_DATABASE)"
          DB_USERNAME="$(env_value DB_USERNAME)"
          DB_PASSWORD="$(env_value DB_PASSWORD)"
          DB_HOST="$(env_value DB_HOST)"

          if [ -n "$DB_DATABASE" ]; then
            mkdir -p storage/backups
            STAMP="$(date +%Y%m%d-%H%M%S)"
            MYSQL_PWD="$DB_PASSWORD" mysqldump \
              --single-transaction --quick --routines \
              -h "${DB_HOST:-127.0.0.1}" -u "${DB_USERNAME:-root}" \
              "$DB_DATABASE" | gzip > "storage/backups/db-$STAMP.sql.gz"
            echo "Wrote storage/backups/db-$STAMP.sql.gz"
            # Seven survives a bad week and is small enough to stop thinking about.
            ls -1t storage/backups/db-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm --
          else
            echo "::warning::DB_DATABASE is not set in .env, so nothing was backed up."
          fi

          echo "--- Migrate"
          php artisan migrate --force

          echo "--- Caches"
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # storage/ is excluded from rsync and keeps its own permissions.
          # bootstrap/cache is not, and arrives owned by the deploy user.
          chmod -R ug+rwX bootstrap/cache storage || true

          echo "--- Restart"
          # Passwordless sudo is checked on its own, because without it every
          # supervisorctl call below fails identically and the error would read
          # as "supervisor does not know these programs" when it means "this
          # account may not ask".
          if ! sudo -n true 2>/dev/null; then
            echo "::error::$(whoami) cannot use sudo without a password."
            echo "supervisorctl needs it. Grant it, or give this account supervisor access directly."
            exit 1
          fi

          # Octane holds the application in memory. Without this the old
          # process keeps serving the old code, and a new route 404s while
          # every other sign says the deploy worked.
          #
          # The list is read once rather than probing each name: a program that
          # is configured but currently stopped makes `supervisorctl status
          # <name>` exit non-zero, which would report it as missing when it is
          # merely down — and stopped is exactly the state a restart fixes.
          known="$(sudo -n supervisorctl status 2>/dev/null | awk '{print $1}')"
          absent=""
          for program in brin-octane brin-queue brin-schedule; do
            # `(^|:)name$` so a program inside a supervisor group matches too,
            # and the restart uses the full name supervisor actually printed.
            target="$(echo "$known" | grep -E "(^|:)${program}\$" | head -1 || true)"
            if [ -n "$target" ]; then
              sudo -n supervisorctl restart "$target"
            else
              absent="$absent $program"
            fi
          done

          if [ -n "$absent" ]; then
            echo "::error::supervisor does not know:$absent"
            echo "New code is on disk, but the old processes are still serving it."
            echo "Install the three programs from ARCHITECTURE.md section 8, then re-run."
            echo "What supervisor does know:"
            echo "$known"
            exit 1
          fi
          REMOTE

      # A restart that reported success is not proof the application came back.
      # This asks the running process, on the port nginx proxies to.
      - name: Ask the server whether it is actually up
        run: |
          set -euo pipefail

          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # /api/news is public, cheap, and reaches the database. An empty feed
          # is still a 200, which is what makes it usable as a smoke check.
          for attempt in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/news || true)"
            if [ "$code" = "200" ]; then
              echo "GET /api/news -> 200 after ${attempt} attempt(s)."
              exit 0
            fi
            echo "attempt ${attempt}: got '${code}', waiting."
            sleep 3
          done

          echo "::error::The API never answered 200 on 127.0.0.1:8000 within 30s."
          sudo -n supervisorctl status brin-octane || true
          tail -n 40 storage/logs/laravel.log 2>/dev/null || true
          exit 1
          REMOTE

          {
            echo "### Backend deployed"
            echo "Commit ${{ github.sha }} to $DEPLOY_PATH on the VPS."
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android APK
    needs: preflight
    # Feature branches get tests and a preview URL; an APK nobody asked for is
    # six minutes of runner time per push.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('fe/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # The single biggest saving in this file. Without it every run
      # re-downloads the Android Gradle Plugin and its dependency tree.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fe/android/**/*.gradle*', 'fe/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        working-directory: fe
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
          mv build/app/outputs/flutter-apk/app-deepCT-ai.apk \
             "$GITHUB_WORKSPACE/brin-neutron-ct.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: brin-neutron-ct.apk

  linux:
    name: Linux desktop
    needs: preflight
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('fe/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # Flutter's Linux target compiles against GTK, and the runner image does
      # not carry the headers. Without them the build fails at CMake configure
      # time with a missing gtk/gtk.h, which reads like a Flutter problem and is
      # not one.
      #
      # libsecret and jsoncpp are not Flutter's — they are
      # `flutter_secure_storage_linux`, which stores the auth token in the
      # system keyring and whose CMakeLists checks for both. The failure names
      # only the first:
      #
      #   The following required packages were not found:
      #    - libsecret-1>=0.18.4
      #
      # A plugin's native dependency is invisible in pubspec.yaml, so the list
      # below is the only place it is written down.
      - name: Desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Build
        working-directory: fe
        run: |
          flutter pub get
          flutter build linux --release --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Package
        working-directory: fe/build/linux/x64/release/bundle
        run: tar -czf "$GITHUB_WORKSPACE/brin-neutron-ct-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: brin-neutron-ct-linux-x64.tar.gz

  apple:
    name: iOS and macOS
    needs: preflight
    # macOS runners bill at ten times the ubuntu rate, so this stays off feature
    # branches. On main it runs, because a release is expected to carry every
    # client.
    #
    # Both Apple targets share one runner deliberately. They need the same
    # toolchain and the same warm pub cache, and a second macOS job would double
    # the most expensive line on the bill to save a few minutes.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # iOS can only be built on macOS, and this is the whole point of the job:
    # it produces Apple builds without anyone owning a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('fe/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # There is no Podfile in the repository — Flutter writes one during the
      # build from the plugin list — so the CocoaPods spec repo is keyed on the
      # thing that decides that list.
      - uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('fe/pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Build (unsigned)
        working-directory: fe
        # --no-codesign because signing needs an Apple Developer account and a
        # provisioning profile. The result is a real, complete iOS build that
        # simply cannot be installed on a device until it is signed. Add the
        # certificate as a secret and drop this flag when that account exists.
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Package iOS
        working-directory: fe/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr "$GITHUB_WORKSPACE/brin-neutron-ct-ios-unsigned.ipa" Payload

      # Unsigned as well, and for the same reason. macOS will refuse to open it
      # until it is either signed or cleared by hand in System Settings, which
      # is acceptable for a research tool distributed to a known group.
      - name: Build macOS
        working-directory: fe
        run: flutter build macos --release --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Package macOS
        working-directory: fe/build/macos/Build/Products/Release
        run: |
          APP="$(ls -d *.app | head -1)"
          echo "Packaging $APP"
          # `ditto` rather than `zip`: it preserves the resource forks and
          # symlinks inside a bundle, which a plain zip flattens into something
          # macOS will not launch.
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "$GITHUB_WORKSPACE/brin-neutron-ct-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: brin-neutron-ct-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: brin-neutron-ct-macos.zip

  publish:
    name: Publish
    # `test` is here rather than in front of the builds. Nothing is published
    # from a tree that does not pass its own tests; the builds simply no longer
    # queue behind the suite to find that out.
    needs: [test, web, android, linux, apple]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Secrets are lifted into the job environment because a step's `if:` cannot
    # read the `secrets` context — it can read `env`. This is the supported way
    # to make a step conditional on a secret existing.
    env:
      RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      # By name rather than `merge-multiple`, so the unpacked web directory does
      # not land in the same folder as the three files being released.
      - uses: actions/download-artifact@v4
        with: { name: web, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: android, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: ios, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: macos, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: linux, path: dist }

      - name: List what was built
        run: ls -lh dist

      # The release notes both steps below use.
      - name: Write the release notes
        run: |
          cat > notes.md <<'MARKDOWN'
          **Web** — unzip and serve as static files.
          **Android** — `brin-neutron-ct.apk`, universal build.
          **iOS** — unsigned; signing needs an Apple Developer account.
          **macOS** — unsigned; macOS will ask before opening it the first time.
          **Linux** — x64 bundle; needs GTK 3 present on the machine.
          MARKDOWN
          {
            echo
            echo "All five were compiled against \`${API_BASE_URL}\`."
            echo
            echo "Built from \`${GITHUB_SHA}\`."
          } >> notes.md

      # Publishing is done with the `gh` CLI behind a retry, and that is the
      # entire point of it not being an action any more.
      #
      # Three separate runs failed here on GitHub's own side — "Resource not
      # accessible by integration", then twice "No server is currently
      # available to service your request" — while every build beneath them
      # succeeded. Nothing was wrong with the artifacts; the releases API was
      # simply unavailable for a few seconds. An action that gives up on the
      # first 5xx turns a hiccup into a red run and a release that silently
      # holds yesterday's files.
      #
      # RELEASE_TOKEN is honoured if it exists, so a fine-grained PAT can take
      # over should the 403 ever turn out to be the repository's Workflow
      # permissions rather than weather.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # `gh` works out which repository it is talking about from the git
          # remote in the working directory. This job never checks the
          # repository out — it only downloads the built artifacts — so there is
          # no remote to read and every call failed with
          #
          #   failed to run git: fatal: not a git repository
          #
          # GH_REPO says it outright and skips the detection entirely, which is
          # cheaper than cloning the repository to tell `gh` something the
          # runner already knows.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Publishing to $GH_REPO"

          # One cheap call before the retries, because retrying is only right
          # for weather. The last failure here was configuration — `gh` could
          # not tell which repository it was for — and the loop patiently spent
          # three minutes rediscovering that five times over, twice. If this
          # call fails, nothing that follows would have worked either.
          if ! gh repo view "$GH_REPO" --json name >/dev/null; then
            echo "::error::Cannot reach $GH_REPO as the token provided. This is a"
            echo "configuration problem, not a transient one — check GH_REPO and"
            echo "the token's contents permission rather than re-running."
            exit 1
          fi

          # Five attempts, backing off 10s, 20s, 30s, 40s. The outages seen so
          # far lasted seconds; this covers a couple of minutes of them.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 5 ]; then
                echo "::error::Giving up after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n failed. Retrying in $((n * 10))s..."
              sleep $((n * 10))
              n=$((n + 1))
            done
          }

          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="$TAG"
            EXTRA="--generate-notes"
          else
            # One long-lived release for main, so the download links never
            # change. The tag has to be recreated rather than edited: the
            # release API cannot move a tag, and a tag pointing at one commit
            # while the notes name another is worse than no tag.
            TAG="latest"
            TITLE="Latest build from main"
            EXTRA="--latest=false"
            retry gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          retry gh release create "$TAG" dist/* \
            --title "$TITLE" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            $EXTRA

      # rclone with an OAuth token for a *personal* Google account, not a
      # service account. That choice matters: a service account has no Drive
      # storage quota of its own, so uploading into a folder in someone's My
      # Drive fails with "Service Accounts do not have storage quota" — a
      # message that sounds like a permissions problem, is not one, and costs
      # an afternoon.
      #
      # To configure, once, on any machine with rclone installed:
      #
      #     rclone authorize "drive"
      #
      # Sign in, then put the JSON it prints into the repository secret
      # RCLONE_DRIVE_TOKEN, and the destination folder id — the last segment of
      # the folder's URL — into GDRIVE_FOLDER_ID.
      - name: Upload to Google Drive
        if: >-
          env.RCLONE_DRIVE_TOKEN != '' && env.GDRIVE_FOLDER_ID != ''
          && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone

          # One subfolder per release, so successive builds do not overwrite
          # each other and "which APK was that?" stays answerable.
          RELEASE_DIR="${GITHUB_REF_NAME:-manual-$(date +%Y%m%d-%H%M)}"

          rclone mkdir "gdrive:$RELEASE_DIR"
          rclone copy dist "gdrive:$RELEASE_DIR" -P

          echo "Uploaded to Drive folder: $RELEASE_DIR"

      - name: Say why Drive was skipped
        if: env.RCLONE_DRIVE_TOKEN == '' || env.GDRIVE_FOLDER_ID == ''
        run: |
          echo "::notice::Google Drive upload skipped."
          echo "Set the repository secrets RCLONE_DRIVE_TOKEN and GDRIVE_FOLDER_ID"
          echo "to enable it. See the comment in .github/workflows/release.yml."
