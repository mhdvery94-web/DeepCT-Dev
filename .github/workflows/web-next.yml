name: Next.js Web

on:
  pull_request:
    branches: [develop, staging, main]
    paths:
      - 'fe_web/**'
      - '.github/workflows/web-next.yml'
  push:
    branches: [develop, staging, main]
    paths:
      - 'fe_web/**'
      - '.github/workflows/web-next.yml'
  workflow_dispatch:

concurrency:
  group: next-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe_web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and type-check
        run: npm run check

      - name: Build
        env:
          # The public landing page tolerates an unavailable API during build;
          # runtime deployment selects the real endpoint in the deploy job.
          LARAVEL_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

  deploy:
    name: Deploy Next.js to Vercel
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.DEEPCT_WEB_VERCEL_TOKEN || secrets.DEEPCT_DEV_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.DEEPCT_WEB_VERCEL_ORG_ID || secrets.DEEPCT_DEV_VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.DEEPCT_WEB_VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: deepct-web
      LARAVEL_API_BASE_URL: >-
        ${{ github.ref_name == 'main'
            && (vars.RASPI_API_BASE_URL || vars.NGROK_RASPI)
            || github.ref_name == 'staging'
            && vars.STAGING_API_BASE_URL
            || github.ref_name == 'develop'
            && (vars.DEVELOP_API_BASE_URL || vars.NGROK_RASPI || vars.RASPI_API_BASE_URL)
            || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and configure Vercel project
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != ''
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_REF="${VERCEL_PROJECT_ID:-$VERCEL_PROJECT_NAME}"
          PROJECT_JSON="$(curl -fsS --get \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            "https://api.vercel.com/v9/projects/$PROJECT_REF")"
          PROJECT_ID="$(jq -r '.id // empty' <<< "$PROJECT_JSON")"

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Vercel project '$VERCEL_PROJECT_NAME' was not found in the configured organization."
            exit 1
          fi

          ROOT_DIRECTORY="$(jq -r '.rootDirectory // empty' <<< "$PROJECT_JSON")"
          FRAMEWORK="$(jq -r '.framework // empty' <<< "$PROJECT_JSON")"
          if [ "$ROOT_DIRECTORY" != fe_web ] || [ "$FRAMEWORK" != nextjs ]; then
            UPDATED_PROJECT="$(curl -fsS -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"rootDirectory":"fe_web","framework":"nextjs"}' \
              "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$VERCEL_ORG_ID")"

            if [ "$(jq -r '.rootDirectory // empty' <<< "$UPDATED_PROJECT")" != fe_web ] \
              || [ "$(jq -r '.framework // empty' <<< "$UPDATED_PROJECT")" != nextjs ]; then
              echo "::error::Vercel did not retain the required fe_web/Next.js project settings."
              exit 1
            fi
          fi

          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        id: deployment-config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            if [ "${{ github.ref_name }}" = develop ]; then
              echo "::warning::Next.js Vercel project credentials or project lookup are not configured yet; verification passed and the develop deployment is skipped."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Configure the deepct-web project and a DeepCT/Vercel token plus organization ID."
            exit 1
          fi

          if [ -z "${LARAVEL_API_BASE_URL:-}" ]; then
            if [ "${{ github.ref_name }}" = develop ]; then
              echo "::warning::DEVELOP_API_BASE_URL is not configured yet; verification passed and the develop deployment is skipped."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No API URL is configured for branch '${{ github.ref_name }}'."
            echo "Use DEVELOP_API_BASE_URL, STAGING_API_BASE_URL, or RASPI_API_BASE_URL as appropriate."
            exit 1
          fi

          case "$LARAVEL_API_BASE_URL" in
            https://*/api|https://*/api/) ;;
            *)
              echo "::error::LARAVEL_API_BASE_URL must be HTTPS and end in /api."
              exit 1
              ;;
          esac

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel project settings
        if: steps.deployment-config.outputs.enabled == 'true'
        shell: bash
        run: |
          ENVIRONMENT=preview
          if [ "${{ github.ref_name }}" = main ]; then ENVIRONMENT=production; fi
          npx --yes vercel@latest pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        if: steps.deployment-config.outputs.enabled == 'true'
        shell: bash
        run: |
          PROD=""
          if [ "${{ github.ref_name }}" = main ]; then PROD="--prod"; fi
          npx --yes vercel@latest build $PROD \
            --build-env LARAVEL_API_BASE_URL="$LARAVEL_API_BASE_URL" \
            --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: steps.deployment-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PROD=""
          if [ "${{ github.ref_name }}" = main ]; then PROD="--prod"; fi
          npx --yes vercel@latest deploy --prebuilt $PROD \
            --env LARAVEL_API_BASE_URL="$LARAVEL_API_BASE_URL" \
            --token="$VERCEL_TOKEN" | tee deployment-url.txt
          URL="$(tail -1 deployment-url.txt)"
          case "$URL" in
            https://*) ;;
            *) echo "::error::Vercel returned no deployment URL."; exit 1 ;;
          esac
          echo "### Next.js deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
