name: Deploy web

# Builds the Flutter web client and hands the finished files to Vercel.
#
# Vercel's own Git integration is not used, and that is the point. On the Hobby
# plan with a private repository, Vercel refuses to build a commit whose author
# is not the account owner — which is what blocked every deployment on this
# project. A deployment made with a token is attributed to the token's owner,
# so that check never runs. It also means Flutter is built here, where the SDK
# is a single action away, rather than fetched inside a Vercel builder.
#
# Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        Account Settings → Tokens
#   VERCEL_ORG_ID       from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID   likewise
#
# Variables:
#   NGROK_BE            the API base the client compiles against. It must be the
#                       full base including the /api suffix, e.g.
#                       https://<name>.ngrok-free.dev/api — the client appends
#                       paths to it directly.
#
# main goes to production; every other branch gets a preview URL, which is the
# testing environment.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      # The CLI reads these to know which project it is deploying, which is what
      # replaces `vercel link` on a runner with no interactive session.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build
        working-directory: fe
        env:
          API_BASE_URL: ${{ vars.NGROK_BE }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::The repository variable NGROK_BE is empty."
            echo "The address is compiled into the client, so an empty one ships"
            echo "a build that cannot reach any backend."
            exit 1
          fi
          echo "Building against $API_BASE_URL"
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

      # Vercel's Build Output API. Handing over a finished directory means the
      # Vercel side runs no build at all — no Flutter SDK, no build minutes, and
      # nothing that can fail there for reasons we cannot see.
      #
      # The routes are the same three rules fe/vercel.json carries, restated
      # here because a prebuilt deployment takes its routing from this file and
      # ignores vercel.json.
      - name: Assemble the build output
        run: |
          mkdir -p .vercel/output/static
          cp -r fe/build/web/. .vercel/output/static/
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/assets/(.*)$",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              {
                "src": "^/(index\\.html|flutter_service_worker\\.js|version\\.json)$",
                "headers": { "cache-control": "public, max-age=0, must-revalidate" },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "/.*", "dest": "/index.html" }
            ]
          }
          JSON

      - name: Deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx --yes vercel@latest deploy --prebuilt --prod \
              --token="${{ secrets.VERCEL_TOKEN }}" | tee url.txt
          else
            npx --yes vercel@latest deploy --prebuilt \
              --token="${{ secrets.VERCEL_TOKEN }}" | tee url.txt
          fi
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$(tail -1 url.txt)" >> "$GITHUB_STEP_SUMMARY"
