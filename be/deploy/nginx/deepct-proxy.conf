# Proxy settings for the DeepCT backend (Laravel Octane on 127.0.0.1:8000).
#
# Included by every server block that fronts it, so the plain-HTTP door and the
# TLS door cannot drift apart. Change a timeout here and both change together;
# that is the entire reason this is a separate file rather than two copies.

proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;

proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "Upgrade";

# A single prediction result reaches ~1.5 GB, and buffering is on by default.
# That means nginx writes the entire file into /var/lib/nginx before sending
# the client its first byte: the download takes roughly twice as long, and the
# disk fills with copies of files the platform is about to delete anyway.
#
# Request buffering off for the same reason in the other direction — an upload
# is up to 2 GB, arriving in chunks.
proxy_buffering off;
proxy_request_buffering off;

# These cover a slow link, not slow inference. A prediction runs on the queue
# worker and never inside a request, so no request should ever need two hours.
proxy_connect_timeout 60s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;
